from typing import List, Optional, Dict, Any

router = APIRouter(prefix="/ws", tags=["websocket"])

class ConnectionManager:
    def __init__(self):
        self.active_connections: List[WebSocket] = []

    async def connect(self, websocket: WebSocket):
        await websocket.accept()
        self.active_connections.append(websocket)

    def disconnect(self, websocket: WebSocket):
        if websocket in self.active_connections:
            self.active_connections.remove(websocket)

    async def broadcast(self, message: dict):
        dead_connections = []
        for connection in self.active_connections:
            try:
                await connection.send_json(message)
            except Exception:
                dead_connections.append(connection)
        for connection in dead_connections:
            if connection in self.active_connections:
                self.active_connections.remove(connection)

import time
from copy import deepcopy
from typing import Dict, Any, Optional

from services.agents.ui_optimizer_agent import ui_optimizer_agent
from core.logger import logger

class DataFlowAuditorAgent:
    """
    Dashboard veri akışını optimize eden, sadece değişen (Delta) verileri
    zaman damgası ile paketleyen Olay Güdümlü denetleyici ajan.
    """
    def __init__(self):
        self._last_state: Optional[Dict[str, Any]] = None
        self._last_hash: Optional[str] = None
        
    def get_audited_delta(self) -> Optional[Dict[str, Any]]:
        """
        Sistemin o anki durumunu çeker. Bir önceki duruma göre fark var mı bakar.
        Fark varsa zaman damgası ekleyip gönderir. Yoksa None döner (Veri çöpünü önler).
        """
        try:
            current_state = ui_optimizer_agent.get_unified_state()
        except Exception as e:
            logger.error(f"UI Optimizer Agent hatası: {e}")
            return None
            
        state_to_compare = deepcopy(current_state)
        if "timestamp" in state_to_compare:
            del state_to_compare["timestamp"]
            
        # Hafif parmak izi (Fingerprint) - tam JSON serileştirme yerine kritik alanlardan hash
        try:
            positions_fp = str([(p.get("symbol"), p.get("current_price"), p.get("unrealized_pnl")) 
                                 for p in current_state.get("active_positions", [])])
            picks_fp = str([(p.get("symbol"), p.get("confidence_pct"), p.get("price")) 
                            for p in current_state.get("top_picks", [])[:10]])  # Sadece ilk 10
            advisory_fp = str({k: v[:2] for k, v in current_state.get("advisory_streams", {}).items()})
            current_hash = f"{positions_fp}|{picks_fp}|{advisory_fp}"
        except Exception:
            current_hash = str(time.time())  # Hata durumunda her zaman güncelle
        
        if self._last_hash == current_hash:
            # Hiçbir veri değişikliği yok, arayüze veri basma!
            return None
            
        # Değişim var
        self._last_hash = current_hash
        self._last_state = deepcopy(current_state)
        
        # Milisaniye hassasiyetli zaman damgası
        current_state["timestamp_ms"] = int(time.time() * 1000)
        
        return current_state

data_flow_auditor_agent = DataFlowAuditorAgent()

import time
from typing import Dict, Any

from routers.top_picks_cache import get_cached_top_picks
from services.engine.market_advisory_tracker import market_advisory_tracker
from services.market_feed.live_stream import live_trade_manager
from services.engine.trade_journal_learning import trade_journal_engine

class UIOptimizerAgent:
    """
    Tüm dashboard verilerini saniyesinde tek bir pakette birleştirerek (Unified State) 
    görsel çakılmaları ve titremeleri engelleyen ara katman ajanı.
    """
    def __init__(self):
        pass

    def get_unified_state(self) -> Dict[str, Any]:
        """
        Dashboard'un ihtiyaç duyduğu tüm verileri (Pozisyonlar, Haberler, Tarama Listesi, vs.)
        tek bir JSON'da birleştirip döner. Asla dış API (ağ) beklemesi yapmaz, RAM'deki veriyi verir.
        """
        # 1. Aktif Pozisyonlar
        try:
            positions = live_trade_manager.get_active_positions()
        except Exception:
            positions = []
            
        # 2. Market Advisory Streams (Kayan Yazı Verileri)
        try:
            advisory_streams = market_advisory_tracker.get_streams()
        except Exception:
            advisory_streams = {"CRYPTO": [], "NASDAQ": [], "BIST": []}
            
        # 3. Top Actionable Picks (Tarama Listesi)
        try:
            picks = get_cached_top_picks()
            picks = sorted(picks, key=lambda x: x.get("confidence_pct", 0), reverse=True)[:100]
        except Exception:
            picks = []
            
        # 4. Market Pulse Data (Risk Parametreleri vb.)
        try:
            pulse = live_trade_manager.get_market_pulse()
        except Exception:
            pulse = {}
            
        # 5. Trade Geçmişi Özeti
        try:
            journal = trade_journal_engine.get_journal()
            closed = [t for t in journal if t.get("exit_time")]
            recent_closed = sorted(closed, key=lambda x: x.get("exit_time", ""), reverse=True)[:10]
        except Exception:
            recent_closed = []
            
        return {
            "status": "success",
            "timestamp": time.time(),
            "active_positions": positions,
            "advisory_streams": advisory_streams,
            "top_picks": picks,
            "market_pulse": pulse,
            "recent_trades": recent_closed
        }

ui_optimizer_agent = UIOptimizerAgent()

    function updatePositionsSimulator() {\r
        DEMO_POSITIONS.forEach((pos, index) => {\r
            // BCHUSD momentumunu hızlandırmak için özel volatilite (Kullanıcı sorusu üzerine)\r
            let volBase = pos.id === 'BCHUSD' ? 0.012 : 0.006; \r
            const volatility = Math.random() * volBase;\r
            const change = (Math.random() - 0.5) * (pos.currentPrice * volatility); \r
            pos.currentPrice += change;\r
            \r
            // Dinamik İzleyen Stop (Trailing Stop / Momentum Rider)\r
            let trailingActive = false;\r
            if (pos.direction === "BUY" && pos.currentPrice >= pos.tp) {\r
                pos.tp = pos.currentPrice * 1.003; // Hedefi yukarı sürükle (Ivme binmesi)\r
                pos.tpPct = ((pos.tp - pos.entryPrice) / pos.entryPrice) * 100;\r
                pos.sl = pos.currentPrice * 0.995; // Zarar kes seviyesini kara (breakeven) taşı\r
                pos.slPct = ((pos.sl - pos.entryPrice) / pos.entryPrice) * 100;\r
                trailingActive = true;\r
            }\r
            \r
            const pnlChange = change * parseFloat(pos.amount.split(' ')[0]);\r
            pos.pnl += pnlChange;\r
            \r
            const amountValStr = pos.amount.split(' ')[1];\r
            if(amountValStr) {\r
                const amountVal = parseFloat(amountValStr.replace(/[^0-9.]/g, ''));\r
                if(amountVal > 0) pos.pnlPct = (pos.pnl / amountVal) * 100;\r
            }\r
\r
            const isUp = change >= 0;\r
            const priceColor = isUp ? "#4ade80" : "#f87171";\r
            const pnlColor = pos.pnl >= 0 ? "#4ade80" : "#f87171";\r
            const bgColor = isUp ? 'rgba(74, 222, 128, 0.12)' : 'rgba(248, 113, 113, 0.12)';\r
            const arrow = pos.pnl >= 0 ? "↗" : "↘";\r
            const tickArrow = isUp ? "▲" : "▼";\r
\r
            const row = document.getElementById(`sim-row-${index}`);\r
            const priceCell = document.getElementById(`sim-price-${index}`);\r
            const pnlCell = document.getElementById(`sim-pnl-${index}`);\r
            const timeCell = document.getElementById(`sim-time-${index}`);\r
\r
            if (timeCell && pos.entryTime) {\r
                const diff = Date.now() - pos.entryTime;\r
                const hours = Math.floor(diff / 3600000);\r
                const mins = Math.floor((diff % 3600000) / 60000);\r
                const secs = Math.floor((diff % 60000) / 1000);\r
                timeCell.textContent = `${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;\r
            }\r

            if (row && priceCell && pnlCell) {\r
                priceCell.innerHTML = `<span style="font-size:10px; margin-right:4px;">${tickArrow}</span>$${pos.currentPrice.toFixed(2)}`;\r
                priceCell.style.color = priceColor;\r
                pnlCell.innerHTML = `${arrow} ${pos.pnl >= 0 ? '+' : ''}$${pos.pnl.toFixed(2)} <span style="font-size:11px;">(${pos.pnl >= 0 ? '+' : ''}%${pos.pnlPct.toFixed(2)})</span>`;\r
                pnlCell.style.color = pnlColor;\r
                \r
                // Trailing Stop DOM Update\r
                if (trailingActive) {\r
                    const tpValCell = document.getElementById(`sim-tp-val-${index}`);\r
                    const tpPctCell = document.getElementById(`sim-tp-pct-${index}`);\r

                    const slPctCell = document.getElementById(`sim-sl-pct-${index}`);\r
