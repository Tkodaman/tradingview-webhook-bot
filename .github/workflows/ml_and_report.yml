name: Derin Masa - YZ Raporlama ve Makro Analiz

on:
  # 1. TradingView veya Bot'tan anlık acil analiz istendiğinde (Örn: Füze hacmi geldiğinde)
  repository_dispatch:
    types: [deep_analysis_trigger]
  
  # 2. Algoritmanın admini beslemesi için her 1 saatte bir otomatik çalışır
  schedule:
    - cron: '18 * * * *' # Load-balancing için her saatin 18. dakikasında çalışır

jobs:
  macro_analysis_and_report:
    runs-on: ubuntu-latest
    
    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Python Ortamını Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Bağımlılıkları (Dependencies) Yükle
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy scikit-learn requests beautifulsoup4
        # Projenin mevcut requirements dosyasını da kullanabiliriz
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: İnterneti Kazı (Haber ve Duygu Analizi)
      env:
        # NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        PYTHONUNBUFFERED: 1
      run: |
        echo "--> Küresel Kripto Haberleri, X(Twitter) Trendleri ve Korku/Açgözlülük İndeksi taranıyor..."
        # python scripts/fetch_market_sentiment.py

    - name: ML Modeli ile Yeniden Eğitim (Heavy Compute)
      run: |
        echo "--> Günlük Kapanış Verileriyle Derin Masa Makine Öğrenimi Modeli Ağır Eğitime Sokuluyor..."
        # python scripts/ml_prediction.py

    - name: İstihbarat Raporunu Oluştur ve Telegram/WebUI'a Fırlat
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        WEBHOOK_URL: ${{ secrets.BOT_WEBHOOK_URL }} # Canlı FastAPI botumuza raporu iletmek için
      run: |
        echo "--> Saatlik Derin Masa Raporu hazırlandı. Yöneticinin telefonuna (Telegram) ve Dashboard'a pushlanıyor."
        # python scripts/send_admin_report.py
